# Cut a release.
#
#     pnpm version minor        # bumps package.json and tags v0.2.0
#     git push --follow-tags
#
# The tag is the trigger and `package.json`'s version is the source of truth —
# electron-builder reads it, and the two cannot disagree because `pnpm version`
# writes both. See `docs/packaging-and-updates.md`.
#
# One tag releases the desktop app publicly and the `hivetty-server` base image
# privately (HIVE-426). The jobs: `create-draft`, then `desktop` and
# `server-tarballs` in parallel, then `server-image` (pushes
# `ghcr.io/behiques/hivetty-server:<version>`), then `publish` (checks every
# image is private, flips the draft, then moves `:next` or `:latest`), then
# `tidy`. A dispatch from a branch runs `desktop` and the tarballs as before,
# pushes no image and publishes nothing.

name: Release

on:
  push:
    tags:
      - 'v*'
  # The escape hatch: rebuild a release whose assets went wrong without moving
  # a tag. Moving a published tag is the one thing that genuinely breaks the
  # updater, because `latest-mac.yml` pins a SHA-512 of each asset and a client
  # mid-download would fail the checksum.
  workflow_dispatch:

# Least privilege. `contents: write` is for the release; each job narrows it,
# and only the two image jobs add `packages: write` (HIVE-426).
permissions:
  contents: write

jobs:
  create-draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: The tag is package.json's version
        # The image is tagged from the tag and electron-builder reads
        # package.json: one release, one version.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "ABORT: tag $GITHUB_REF_NAME is not package.json's v$version."; exit 1; }

      - name: Create the draft release, so nothing has to race to create it
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-builder runs **two** publishers concurrently, and each does a
        # check-then-create on the release. Both see "doesn't exist", both POST,
        # and one of them loses. Straight from the v0.1.4 log:
        #
        #   • publishing  publisher=Github …            (twice, 8ms apart)
        #   • creating GitHub release  reason=release doesn't exist  tag=v0.1.4
        #   • creating GitHub release  reason=release doesn't exist  tag=v0.1.4
        #   HttpError: 422 … {"code":"already_exists","field":"tag_name"}
        #
        # The loser throws, which aborts the publish **after** the dmg and zip
        # have uploaded but **before** `latest-mac.yml` does. That leaves a
        # release the updater cannot read sitting at the top of the list as
        # `latest`, so every installed copy's update check 404s. Measured: it
        # did exactly that, until the release was deleted by hand.
        #
        # Creating it here first means `reason=release doesn't exist` is never
        # true and there is nothing to race over.
        #
        # **A draft**, deliberately. A draft is invisible to the updater and to
        # `releases/latest`, so the several minutes between "release exists" and
        # "release has its assets" cannot break a running app — which is the
        # very failure this step is here to prevent, and it would be absurd to
        # reintroduce it in a smaller window. It is published at the end, once
        # there is something worth publishing.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists — reusing it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --notes "Download the \`.dmg\` below. Once installed, HiveTTY Pro checks for new versions itself and tells you in the Inbox."

  desktop:
    name: macOS (arm64)
    needs: create-draft
    # An Apple Silicon runner, deliberately, not `macos-latest`-whatever-that-is.
    # The build must produce an arm64 bundle, and `node-pty`'s prebuild is
    # selected by the *host* architecture during install — cross-building it
    # from an Intel runner is the slow way to discover that at first launch.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          # Matches `engines.node` in package.json. `cache: pnpm` needs
          # pnpm/action-setup to have run first, which is why it is above.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        # `postinstall` runs `check-native-abi.mjs --fix`, which chmods
        # `node-pty`'s spawn-helper. That has to happen *before* packaging: the
        # bit is copied into the bundle as found, and a 0644 helper is an app
        # whose terminals all fail at spawn.
        run: pnpm install --frozen-lockfile

      - name: Verify
        # The same gates AGENTS.md requires of any change. A release is the last
        # place to find out that type-check was red.
        run: |
          pnpm run lint
          pnpm run type-check
          pnpm run test

      # `APPLE_API_KEY` is a **path**, not a key.
      #
      # `@electron/notarize` documents it as "file system path to the `.p8`
      # private key", and a secret cannot be a path — so the key is written to
      # the runner's temp directory here and the path is exported for the build
      # step below. Passing the base64 straight through as `APPLE_API_KEY` looks
      # right, gets as far as notarization, and then fails on a file that does
      # not exist.
      #
      # Writes nothing when the secret is unset, which is what keeps a release
      # without notarization credentials working: `getNotarizeOptions` treats
      # all three variables as absent and skips.
      - name: Stage the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "no App Store Connect key configured — notarization will be skipped"
            exit 0
          fi
          install -d -m 700 "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          # electron-builder uploads the dmg, the zip and latest-mac.yml to the
          # draft `create-draft` made. It no longer creates anything: `releaseType:
          # draft` in electron-builder.yml means it also never flips the draft,
          # so publication is one decision made in one place — the `publish` job,
          # and only when the build actually succeeded.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Developer ID certificate, as a base64 `.p12` plus its password.
          # electron-builder imports it into a temporary keychain it creates and
          # destroys per run, so nothing is left on the runner.
          #
          # **Both halves of the export matter**: the `.p12` has to contain the
          # certificate *and* its private key, or the import succeeds and the
          # signature step then fails with an identity it cannot use.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization, via an App Store Connect API key. Apple staples the
          # ticket to the app, which is what stops a downloaded dmg being
          # refused as "damaged".
          #
          # `APPLE_API_KEY` is deliberately **not** here — the step above puts
          # it into `$GITHUB_ENV` as a filesystem path, because that is what
          # `@electron/notarize` expects.
          #
          # These three are all-or-nothing: `getNotarizeOptions` throws
          # `InvalidConfigurationError` when some are set and others are not.
          # Unset means all three arrive empty, which is falsy, which is the
          # skip path — a half-configured repository is the failure case, and
          # failing loudly there is correct.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # `CSC_IDENTITY_AUTO_DISCOVERY: 'false'` used to live here, when there
          # was no certificate to find. It is deliberately gone: it would now
          # override every secret above and silently publish an unsigned build
          # that no installed copy could update to.
          #
          # A run with the secrets unset does not fail — electron-builder skips
          # signing and notarization and produces the ad-hoc build, exactly as
          # a developer machine without a certificate does. That is a release
          # worth noticing rather than one worth aborting, and the smoke check
          # below still runs against it.
        run: pnpm run desktop:publish

      - name: Record what shipped
        # The signature state of the shipped bundle, in the build log, on every
        # release. The whole update design turns on whether this says `adhoc`,
        # and reading it out of a log beats re-deriving it from a local build
        # that may not match.
        if: always()
        run: |
          echo "--- dist ---"
          ls -la dist || true
          echo "--- codesign ---"
          codesign --display --verbose=2 "dist/mac-arm64/HiveTTY Pro.app" 2>&1 || true

  # The server tarballs for this tag, as workflow artifacts (HIVE-425). Never
  # attached to the release; `server-image` builds from them.
  server-tarballs:
    name: Server tarballs
    uses: ./.github/workflows/server.yml
    with:
      release: true
    permissions:
      contents: read

  # The private base image (HIVE-426). Pushes `:<version>` and nothing else:
  # `publish` moves `:latest` or `:next`, once every job has passed.
  server-image:
    name: Server image
    if: startsWith(github.ref, 'refs/tags/')
    needs: server-tarballs
    # arm64 is the fleet's architecture, so it is the native one. amd64's
    # `apt-get` runs under QEMU; nothing compiles.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # One folder per artifact, which is the build context the Dockerfile reads.
      - uses: actions/download-artifact@v4
        with:
          pattern: hivetty-server-linux-*
          path: ${{ runner.temp }}/ctx

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the version tag
        id: push
        run: |
          set -euo pipefail
          image="ghcr.io/behiques/hivetty-server"
          args=()
          while IFS= read -r pin; do args+=(--build-arg "$pin"); done \
            < <(grep -E '^[A-Z_]+=' packaging/server/versions.env)
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            -f packaging/server/Dockerfile \
            "${args[@]}" \
            -t "$image:${GITHUB_REF_NAME#v}" \
            --push \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            "$RUNNER_TEMP/ctx"
          digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/metadata.json")
          [[ "$digest" == sha256:* ]] || { echo "ABORT: the push reported no digest."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # What was pushed, booted: the reduced image case, on the native architecture.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install, no scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Boot the pushed image
        run: pnpm exec vitest run tests/live/server-edition-conformance.test.ts
        env:
          HIVE_LIVE_SERVER_EDITION_PROOF: '1'
          HIVE_SERVER_IMAGE: ghcr.io/behiques/hivetty-server@${{ steps.push.outputs.digest }}
          HIVE_SERVER_RELEASE: '1'

  # All or nothing: every job above passed, or nothing below runs. The order
  # of the steps is the contract. HIVE-303 adds `runner-image` to `needs`,
  # `hivetty-runner` to both loops, and its digest to the last step.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [create-draft, desktop, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Every image is private
        # Asked the way a stranger would: with no credentials, GHCR must refuse
        # the manifest. A 200 is a public package. Anything else is "could not
        # tell", and that fails too. The signed-in inspect comes first so a
        # 404 can only mean "refused", never "no such tag".
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for name in hivetty-server; do
            repo="behiques/$name"
            docker buildx imagetools inspect "ghcr.io/$repo:$version" > /dev/null \
              || { echo "ABORT: ghcr.io/$repo:$version does not exist."; exit 1; }
            token=$(curl -sS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty' || true)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/$repo/manifests/$version" || true)
            case "$code" in
              401 | 403 | 404) echo "ghcr.io/$repo is private (an anonymous pull answered $code)." ;;
              200) echo "ABORT: ghcr.io/$repo is PUBLIC. Make it private in the package's settings, then re-run this job."; exit 1 ;;
              *) echo "ABORT: could not tell whether ghcr.io/$repo is private (HTTP '$code')."; exit 1 ;;
            esac
          done

      - name: Publish the release
        # Only on success, and only once `latest-mac.yml` is actually there. A
        # release without it is not a release — the updater reads that file and
        # nothing else to decide a new version exists.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')
          echo "assets: $assets"
          echo "$assets" | jq -e 'index("latest-mac.yml")' >/dev/null \
            || { echo "ABORT: latest-mac.yml is missing — refusing to publish a release no app can use."; exit 1; }
          # A semver prerelease tag (`v1.0.0-rc.1`) is a release candidate: published as a GitHub prerelease and
          # never `latest`. Its build talks to the dev cloud (`core/licence/cloud.ts`), and only a copy
          # already on a prerelease is offered it — electron-updater turns on `allowPrerelease` from the version.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published $GITHUB_REF_NAME."

      - name: Move the image's moving tag
        # After the flip, never before. A prerelease moves `:next` and never
        # `:latest`. Retagging a digest copies no layers.
        env:
          SERVER_DIGEST: ${{ needs.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then moving=next; else moving=latest; fi
          image="ghcr.io/behiques/hivetty-server"
          docker buildx imagetools create -t "$image:$moving" "$image@$SERVER_DIGEST"
          {
            echo "### $GITHUB_REF_NAME"
            echo "- \`$image:$version\` and \`:$moving\`: \`$SERVER_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  tidy:
    name: Tidy
    # `always()`, because the case that hurt was a failed run leaving an
    # unusable release behind.
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tidy the releases for this tag
        # `always()`, because the case that hurt was a **failed** run leaving an
        # unusable release behind. Runs after both outcomes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One rule, which covers every way this can go wrong: **keep exactly the
        # release that carries `latest-mac.yml`, delete every other release for
        # this tag.**
        #
        # A release without that file cannot serve an update, so it is never
        # worth keeping — whether it is a duplicate the publisher raced into
        # existence, or the half-finished remains of a build that failed. And a
        # good release from an earlier run is never at risk, because it has the
        # file.
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")]")
          keep=$(echo "$releases" | jq -r \
            'map(select([.assets[].name] | index("latest-mac.yml"))) | .[0].id // empty')
          echo "$releases" | jq -r --arg keep "${keep:-0}" \
            '.[] | select(.id != ($keep | tonumber)) | .id' \
          | while read -r stray; do
              echo "Deleting unusable release $stray for ${GITHUB_REF_NAME}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$stray"
            done
          if [ -z "$keep" ]; then
            echo "Nothing for ${GITHUB_REF_NAME} carries latest-mac.yml — kept nothing."
          else
            echo "Kept release $keep."
          fi
