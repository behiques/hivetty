# The gates on every pull request and every push to main (HIVE-417).
#
# What runs here: lint, type-check, the unit suite with its 80% coverage gate,
# the process-boundary check, and the web half of the Playwright suite in
# Chromium. These are the gates AGENTS.md asks of every change, and none of
# them needs anything a Linux runner lacks: unit tests use
# `__mocks__/node-pty.ts`, so no real PTY is spawned, and the `web` project is
# the shell with no bridge behind it.
#
# What stays local, and why: the Electron e2e project, `test:pty`,
# `test:mcp-host` and every live conformance suite except the two the `Server`
# workflow runs against the Linux tarball (`server.yml`). They need macOS, a
# display, a real PTY under Electron's ABI, or real agent CLIs with
# credentials, and a runner has none of those. Run them before handing a
# change over.
#
# The job's name, `ci`, is the required status check on main. Renaming it
# un-requires the check without anyone noticing, so it stays as it is.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A PR's runs share one group per ref, so a new commit supersedes the run in
# flight. On main the group is the commit itself: GitHub keeps one pending run
# per group and drops the older, so a per-ref group would skip a merge landing
# between two others.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty on a fork's pull request: secrets are not passed there, and the swarm tests skip.
      HAS_SWARMS_KEY: ${{ secrets.HIVETTY_SWARMS_READ_KEY != '' }}

    steps:
      - uses: actions/checkout@v5

      # The Dev Squad swarm (HIVE-448): tests/swarm reads it. A read-only deploy key on
      # behiques/hivetty-swarms; GITHUB_TOKEN cannot read another private repository.
      # After the first checkout, which cleans the workspace.
      - uses: actions/checkout@v5
        if: env.HAS_SWARMS_KEY == 'true'
        with:
          repository: behiques/hivetty-swarms
          ssh-key: ${{ secrets.HIVETTY_SWARMS_READ_KEY }}
          path: .swarms

      - name: Point the swarm tests at the checkout
        if: env.HAS_SWARMS_KEY == 'true'
        run: echo "HIVE_SWARM_DIR=$GITHUB_WORKSPACE/.swarms/dev-squad" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `postinstall` runs `check-native-abi.mjs --fix`. node-pty has no Linux
      # prebuild, so it builds from source here; the build is N-API, which
      # loads under Electron without a rebuild, so the check holds as it is.
      # `tests/core/config/login-env.test.ts` runs the login-env probe
      # through every shell the config may name, zsh included. ubuntu ships
      # without it; macOS has it at /bin/zsh, so this matches the developer box.
      - name: sudo apt-get install -y zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm type-check
        run: pnpm type-check

      - name: pnpm test:coverage
        run: pnpm test:coverage

      - name: pnpm verify:boundaries
        run: pnpm verify:boundaries

      - name: pnpm exec playwright install --with-deps chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: pnpm test:e2e:web
        id: e2e
        run: pnpm test:e2e:web

      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
